<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mónica 9 — Cuentas por Cobrar</title>
<style>
  :root{
    --bg:#070a0f; --bg2:#0a0f16; --grid:rgba(125,155,205,.07);
    --panel:#0e151f; --panel2:#0b111a; --card:#101a26;
    --line:#1c2836; --line2:#26374b;
    --text:#e7eef7; --muted:#7f93ac;
    --amber:#f5a623; --amber2:#ffc45c; --amber-d:#b6791275;
    --blue:#3b82f6; --ok:#34d399; --warn:#f5a623; --danger:#f2545b;
    --accent:#f5a623;
    --shadow:0 24px 60px rgba(0,0,0,.62);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;padding:0;height:100vh;overflow:hidden;color:var(--text);
    font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}

  /* ---------- Escritorio (cuadrícula oscura) ---------- */
  .desktop{position:relative;height:100vh;overflow:hidden;display:flex;flex-direction:column;padding:16px 16px 0;
    background:
      radial-gradient(1000px 600px at 80% -12%,rgba(245,166,35,.10),transparent 55%),
      radial-gradient(900px 520px at 6% 110%,rgba(59,130,246,.10),transparent 55%),
      repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 34px),
      repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 34px),
      linear-gradient(160deg,var(--bg2),var(--bg))}
  .desktop::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(420px 220px at 14% 84%,rgba(245,166,35,.05),transparent 60%)}

  /* ---------- Ventana principal ---------- */
  .win{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);
    border:1px solid var(--line2);border-top:2px solid var(--amber);border-radius:12px 12px 0 0;box-shadow:var(--shadow);overflow:hidden}
  .titlebar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:8px 8px 8px 14px;color:var(--text);background:linear-gradient(180deg,#141d2a,#0b111a);border-bottom:1px solid var(--line2);font-weight:600;font-size:13px}
  .tb-title{display:flex;align-items:center;gap:10px;min-width:0}
  .tb-ico{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;color:#1a1206;
    background:linear-gradient(145deg,var(--amber2),#c47f10);box-shadow:0 0 0 3px rgba(245,166,35,.14)}
  .tb-btns{display:flex;gap:5px}
  .tbb{width:28px;height:23px;border:1px solid var(--line2);border-radius:6px;color:var(--muted);font:inherit;font-size:11px;font-weight:700;cursor:pointer;
    background:linear-gradient(180deg,#18222f,#111927)}
  .tbb:hover{color:var(--text);border-color:var(--amber-d);background:linear-gradient(180deg,#1e2a39,#141d29)}
  .tbb.close{color:#ffb0b4;border-color:#5a1d22;background:linear-gradient(180deg,#2a1418,#1c0f12)}
  .tbb.close:hover{background:linear-gradient(180deg,#3a1a1f,#261216)}

  .menubar{flex:none;display:flex;gap:2px;padding:4px 10px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
  .menubar span{padding:3px 10px;border-radius:5px;cursor:default}
  .menubar span:hover{background:#141d29;color:var(--text)}

  .tabbar{flex:none;display:flex;gap:4px;padding:9px 12px 0;background:var(--panel);border-bottom:1px solid var(--line2)}
  .tab{appearance:none;border:1px solid var(--line);border-bottom:none;color:var(--muted);padding:7px 18px;font:inherit;font-size:12px;font-weight:600;
    border-radius:8px 8px 0 0;cursor:pointer;background:linear-gradient(180deg,#0d141d,#0b111a);transition:color .12s,background .12s}
  .tab:hover{color:var(--text);background:linear-gradient(180deg,#121b26,#0d141d)}
  .tab.active{color:var(--amber2);background:linear-gradient(180deg,#131d29,#0f1722);box-shadow:inset 0 -2px 0 var(--amber)}

  .content{position:relative;flex:1;min-height:0;overflow:auto;padding:16px;background:var(--panel2)}
  .tabpane{display:none}.tabpane.active{display:block}

  /* ---------- Secciones y cuadrícula de botones ---------- */
  .sec{background:var(--card);border:1px solid var(--line2);border-radius:10px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.02),0 10px 24px rgba(0,0,0,.28)}
  .sec-head{display:flex;align-items:center;gap:9px;padding:10px 14px;font-weight:700;font-size:12.5px;color:var(--amber2);
    background:linear-gradient(180deg,#131d29,#0f1722);border-bottom:1px solid var(--line2);letter-spacing:.02em}
  .sec-head .k{width:9px;height:9px;border-radius:2px;background:var(--amber);box-shadow:0 0 0 3px rgba(245,166,35,.18)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:12px;padding:14px}
  .tile{appearance:none;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;padding:15px 9px 12px;
    background:linear-gradient(180deg,#121c28,#0d151f);border:1px solid var(--line2);border-radius:10px;color:var(--text);font:inherit;font-size:11.5px;font-weight:600;
    cursor:pointer;min-height:106px;transition:transform .1s ease,box-shadow .14s ease,border-color .14s ease,background .14s ease}
  .tile:hover{border-color:var(--amber);box-shadow:0 10px 24px rgba(0,0,0,.45),0 0 0 3px rgba(245,166,35,.12);transform:translateY(-2px);
    background:linear-gradient(180deg,#16222f,#0f1822)}
  .tile:active{transform:translateY(0)}
  .tile .ico{width:44px;height:44px;color:var(--amber)}
  .tile .ico svg{width:100%;height:100%;display:block}
  .tile .lbl{line-height:1.2}

  /* ---------- Barra de estado / tareas ---------- */
  .statusbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 12px;font-size:11.5px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line2)}
  .statusbar .sb{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--panel2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .taskbar{flex:none;display:flex;align-items:center;gap:9px;height:44px;margin:0 -16px;padding:0 12px;
    background:linear-gradient(180deg,#0f1722,#0a0f16);border-top:1px solid var(--line2);color:var(--text)}
  .start{display:flex;align-items:center;gap:8px;height:32px;padding:0 16px;border:1px solid #c47f10;border-radius:8px;color:#1a1206;font-weight:700;font-size:12.5px;cursor:pointer;
    background:linear-gradient(180deg,var(--amber2),var(--amber))}
  .start:hover{background:linear-gradient(180deg,#ffd27a,#ffb43a)}
  .task{height:32px;padding:0 15px;border:1px solid var(--line2);border-radius:8px;color:var(--text);font-size:12px;cursor:pointer;
    background:linear-gradient(180deg,#141d29,#0e151f)}
  .task:hover{border-color:var(--amber-d)}
  .tray{margin-left:auto;display:flex;align-items:center;gap:8px;height:32px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);font-size:12px;color:var(--amber2);font-variant-numeric:tabular-nums}

  /* ---------- Diálogos (ventanas flotantes) ---------- */
  .overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(4,7,12,.66);backdrop-filter:blur(2px)}
  .overlay.hidden{display:none}
  .dlg{--dlg-accent:var(--amber);display:flex;flex-direction:column;width:min(1000px,96vw);max-height:90vh;background:var(--panel);
    border:1px solid var(--line2);border-top:2px solid var(--dlg-accent);border-radius:12px;box-shadow:0 30px 90px rgba(0,0,0,.7);overflow:hidden;animation:pop .16s ease}
  .dlg.sm{width:min(520px,94vw)}
  @keyframes pop{from{transform:scale(.975);opacity:.5}to{transform:none;opacity:1}}
  .dlg-title{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 9px 8px 14px;color:var(--text);font-weight:700;font-size:13px;
    background:linear-gradient(180deg,#131d29,#0d151f);border-bottom:1px solid var(--line2)}
  .dlg-title .dt{display:flex;align-items:center;gap:9px;min-width:0}
  .dlg-close{width:28px;height:24px;border:1px solid #5a1d22;border-radius:6px;color:#ffb0b4;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#2a1418,#1c0f12)}
  .dlg-close:hover{background:linear-gradient(180deg,#3a1a1f,#261216)}
  .dlg-body{flex:1;min-height:0;overflow:auto;padding:16px;background:var(--panel2)}
  .dlg-foot{flex:none;display:flex;justify-content:flex-end;gap:9px;padding:12px 14px;background:var(--panel);border-top:1px solid var(--line2)}
  .sub{font-size:11.5px;color:var(--muted);margin:0 0 12px}

  .dlg-tools{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line2)}
  .fgroup{display:flex;flex-direction:column;gap:5px}
  .flabel{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
  .fld{background:var(--card);border:1px solid var(--line2);border-radius:7px;padding:7px 10px;font:inherit;font-size:12px;color:var(--text);min-width:155px}
  .fld::placeholder{color:#5b6d84}
  .fld:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,166,35,.18)}
  .radios{display:flex;gap:16px;padding-bottom:3px}
  .radio{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text);cursor:pointer}
  .radio input{accent-color:var(--amber)}

  .btn{appearance:none;border:1px solid var(--line2);border-radius:8px;color:var(--text);padding:8px 17px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;
    background:linear-gradient(180deg,#18222f,#111927)}
  .btn:hover{border-color:var(--amber-d);background:linear-gradient(180deg,#1f2b3a,#141d29)}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:linear-gradient(180deg,#ffc45c,#f5a623);border-color:#c47f10;color:#1a1206;font-weight:700}
  .btn-primary:hover{background:linear-gradient(180deg,#ffd27a,#ffb43a)}
  .btn-ghost{background:linear-gradient(180deg,#141d29,#0e151f);color:var(--muted)}
  .btn-ghost:hover{color:var(--text)}

  .tbl-wrap{border:1px solid var(--line2);border-radius:9px;overflow:auto;max-height:46vh;background:var(--card)}
  table.tbl{width:100%;border-collapse:collapse;font-size:12px}
  .tbl th{position:sticky;top:0;z-index:1;background:linear-gradient(180deg,#131d29,#0f1722);color:var(--amber2);font-weight:700;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.04em;padding:9px 11px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
  .tbl td{padding:8px 11px;border-bottom:1px solid #141d29;white-space:nowrap;color:var(--text)}
  .tbl tbody tr:hover{background:#141f2c}
  .tbl tfoot td{background:#131d29;color:var(--amber2);font-weight:700;border-top:1px solid var(--line2);border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .empty{padding:20px;color:var(--muted);font-size:12px}

  /* ---------- Gráficos ---------- */
  .charts-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line2);border-radius:10px;margin-bottom:16px}
  .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
  .card{position:relative;background:linear-gradient(180deg,#111b27,#0d151f);border:1px solid var(--line2);border-radius:10px;padding:14px;box-shadow:0 10px 24px rgba(0,0,0,.3)}
  .card h3{margin:0 0 6px;font-size:12.5px;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card h3 span:first-child{color:var(--amber2)}
  .card .val{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .card svg{width:100%;height:auto;display:block}

  .palette{position:absolute;z-index:90;width:246px;background:var(--panel);border:1px solid var(--line2);border-top:2px solid var(--amber);border-radius:10px;padding:12px;box-shadow:var(--shadow)}
  .palette.hidden{display:none}
  .palette .pt{font-weight:700;font-size:12px;color:var(--amber2);margin-bottom:9px}
  .palette label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--text);margin-bottom:8px}
  .palette input[type=color]{width:42px;height:26px;border:1px solid var(--line2);border-radius:6px;background:var(--card);padding:0;cursor:pointer}
  .swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
  .sw{width:23px;height:23px;border-radius:6px;border:1px solid rgba(255,255,255,.15);cursor:pointer}
  .hidden{display:none!important}

  @media (max-width:760px){ .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))} .charts-grid{grid-template-columns:1fr} }

  @media print{
    body{background:#fff;color:#000}
    .desktop{display:none}
    .overlay{position:static;background:#fff;padding:0}
    .dlg{box-shadow:none;border:none;width:100%;max-height:none}
    .dlg-foot,.dlg-tools,.dlg-close{display:none!important}
    .tbl th,.tbl td,.tbl tfoot td{color:#000;background:#fff}
  }
</style>
</head>
<body>
<div class="desktop">
  <div class="win">
    <div class="titlebar">
      <div class="tb-title"><span class="tb-ico">₡</span> Mónica 9 — Cuentas por Cobrar</div>
      <div class="tb-btns"><button class="tbb" title="Minimizar">–</button><button class="tbb" title="Maximizar">▢</button><button class="tbb close" title="Cerrar">✕</button></div>
    </div>
    <div class="menubar"><span>Archivo</span><span>Editar</span><span>Ver</span><span>Procesos</span><span>Cobros</span><span>Reportes</span><span>Ayuda</span></div>
    <div class="tabbar" id="tabs"></div>
    <div class="content" id="content"></div>
    <div class="statusbar">
      <span class="sb"><span class="dot"></span><span id="status">Listo</span></span>
      <span class="sb" id="tc">Tipo de cambio: US$ 1 = C$ 19.960</span>
      <span class="sb" id="clock"></span>
    </div>
  </div>
  <div class="taskbar">
    <button class="start"><span>⊞</span> Inicio</button>
    <button class="task">Mónica 9 — Cuentas por Cobrar</button>
    <span class="sb" style="border:none;background:transparent;color:var(--muted)">Córdobas · Nicaragua</span>
    <div class="tray"><span id="trayClock"></span></div>
  </div>
</div>
<div class="overlay hidden" id="overlay"></div>
<script>
const TASA = 19.960;
const fmtNIO = new Intl.NumberFormat('es-NI',{style:'currency',currency:'NIO',minimumFractionDigits:2,maximumFractionDigits:2});
const money = n => fmtNIO.format(Number(n)||0).replace('NIO','C$').replace(/\s+/g,' ').trim();
const usd = n => 'US$ ' + ((Number(n)||0)/TASA).toLocaleString('es-NI',{minimumFractionDigits:2,maximumFractionDigits:2});
const compact = n => { n = Number(n)||0; if(Math.abs(n)>=1000) return 'C$ ' + (n/1000).toFixed(0) + 'k'; return 'C$ ' + n.toFixed(0); };
const num = n => (Number(n)||0).toLocaleString('es-NI',{minimumFractionDigits:2,maximumFractionDigits:2});
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status = m => { $('status').textContent = m; };

/* ---------- Fechas (deterministas, año en curso) ---------- */
const HOY = new Date();
const Y = HOY.getFullYear();
const iso = d => { const x = (d instanceof Date)?d:new Date(d); return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fecha = s => new Date(s+'T00:00:00').toLocaleDateString('es-NI',{day:'2-digit',month:'2-digit',year:'numeric'});
const MES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

/* ---------- Datos: Clientes ---------- */
const CLIENTES = [

  ['CL-0011','Comercial El Pilar','J0310000006712','2266-1122','Managua',120000,'Karla Ruiz'],
  ['CL-0012','Mini Súper La Isla','0011510600006F','2563-7788','Granada',70000,'José Mejía'],
  ['CL-0013','Panadería El Trigal','0011212400007G','8412-3344','Masaya',28000,'Marlon López'],
  ['CL-0014','Hospital Metropolitano','J0310000007823','2270-4455','Managua',260000,'Karla Ruiz']
].map(c=>({codigo:c[0],nombre:c[1],ruc:c[2],telefono:c[3],ciudad:c[4],limite:c[5],cobrador:c[6],saldo:0,vencido:0}));

/* ---------- Datos: Facturas ---------- */
const _F = [
  ['F-1001','Supermercado La Unión',0,9,84500,84500],
  ['F-1002','Hotel Camino Real',0,18,120000,60000],
  ['F-1003','Comedor El Buen Gusto',0,22,24600,24600],
  ['F-1004','Distribuidora El Sol',1,4,156000,90000],
  ['F-1005','Farmacia San Nicolás',1,15,38200,0],
  ['F-1006','Supermercado Palí Norte',1,26,210000,210000],
  ['F-1007','Tienda La Bendición',2,6,18750,5000],

  ['F-1009','Librería Génesis',3,2,27300,27300],
  ['F-1010','Comercial El Pilar',3,21,76500,0],
  ['F-1011','Mini Súper La Isla',4,7,41900,15000],
  ['F-1012','Panadería El Trigal',4,23,15800,15800],
  ['F-1013','Hospital Metropolitano',5,8,184000,120000],
  ['F-1014','Supermercado La Unión',5,24,63400,0],
  ['F-1015','Distribuidora El Sol',6,14,142000,142000],
  ['F-1016','Hotel Camino Real',6,29,88900,30000],
  ['F-1017','Restaurante Los Ranchos',7,11,52700,0],
  ['F-1018','Farmacia San Nicolás',8,3,33100,33100],
  ['F-1019','Comercial El Pilar',8,25,91200,45000],
  ['F-1020','Hospital Metropolitano',9,16,205000,0]
];
const FACTURAS = _F.map(f=>{
  const fch = iso(new Date(Y,f[2],f[3]));
  const venc = iso(new Date(Y,f[2],f[3]+30));
  const saldo = f[4]-f[5];
  const estado = saldo<=0.5 ? 'Pagada' : (new Date(venc) < HOY ? 'Vencida' : 'Pendiente');
  return {numero:f[0],cliente:f[1],fecha:fch,vencimiento:venc,monto:f[4],abonado:f[5],saldo:saldo,estado:estado};
});
FACTURAS.forEach(f=>{ const c=CLIENTES.find(x=>x.nombre===f.cliente); if(!c) return; c.saldo+=f.saldo; if(f.estado==='Vencida') c.vencido+=f.saldo; });

/* ---------- Datos: Cobros / Recibos ---------- */
const _C = [

  ['REC-2002',0,22,'Comedor El Buen Gusto','F-1003','Efectivo',24600,'Marlon López'],

  ['REC-2011',5,8,'Hospital Metropolitano','F-1013','Transferencia',120000,'Karla Ruiz'],
  ['REC-2012',5,28,'Hotel Camino Real','F-1016','Depósito',30000,'Karla Ruiz'],

const AGING_BUCKETS = ['Corriente','1-30 días','31-60 días','61-90 días','+90 días'];
function agingBucket(f){
  if(f.saldo<=0.5) return -1;
  const dias = Math.floor((HOY - new Date(f.vencimiento))/86400000);
  if(dias<=0) return 0; if(dias<=30) return 1; if(dias<=60) return 2; if(dias<=90) return 3; return 4;
}
function agingTotals(){ const a=[0,0,0,0,0]; FACTURAS.forEach(f=>{ const b=agingBucket(f); if(b>=0) a[b]+=f.saldo; }); return a; }

  });
  tabs.querySelectorAll('.tab').forEach(function(t){

/* ---------- Paleta de colores emergente ---------- */
let paletteEl = null;
function closePalette(){ if(paletteEl){ paletteEl.remove(); paletteEl = null; } }
function openPalette(anchor, current, onPick){
  closePalette();
  const p = document.createElement('div');
  p.className = 'palette';
  const swatches = ['#f5a623','#ffc45c','#3b82f6','#34d399','#f2545b','#a78bfa','#22d3ee','#e7eef7'];
  p.innerHTML = '<div class="pt">Color del diálogo</div>'+
    '<label>Personalizado <input type="color" value="'+current+'"></label>'+
    '<div class="swatches">'+ swatches.map(c=>'<span class="sw" style="background:'+c+'" data-c="'+c+'"></span>').join('') +'</div>';
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect();
  p.style.left = Math.min(r.left, window.innerWidth-260) + 'px';
  p.style.top = Math.min(r.bottom+6, window.innerHeight-170) + 'px';
  paletteEl = p;
  const input = p.querySelector('input');
  input.addEventListener('input', ()=> onPick(input.value));
  p.querySelectorAll('.sw').forEach(sw=> sw.addEventListener('click', ()=>{ input.value = sw.dataset.c; onPick(sw.dataset.c); }));
  setTimeout(()=> document.addEventListener('mousedown', outside), 0);
  function outside(e){ if(paletteEl && !paletteEl.contains(e.target) && e.target!==anchor){ closePalette(); document.removeEventListener('mousedown', outside); } }
}

let dlgState = null;
function openDialog(id){
  const cfg = MODAL[id];
  if(!cfg) return;
  closePalette();
  const overlay = $('overlay');
  overlay.innerHTML = '';
  overlay.classList.remove('hidden');

  const dlg = document.createElement('div');
  dlg.className = 'dlg' + (cfg.small?' sm':'');

  const head = document.createElement('div');
  head.className = 'dlg-title';
  head.innerHTML = '<div class="dt"><span class="tb-ico">₡</span> '+esc(cfg.title)+'</div>';
  const close = document.createElement('button');
  close.className = 'dlg-close'; close.textContent = '✕'; close.title = 'Cerrar';
  close.addEventListener('click', ()=> cerrarDialogo());
  head.appendChild(close);

  const body = document.createElement('div');
  body.className = 'dlg-body';

  if(cfg.al || cfg.buscar){
    const tools = document.createElement('div');
    tools.className = 'dlg-tools';
    if(cfg.al){
      tools.innerHTML += '<div class="fgroup"><label class="flabel">Al (fecha final)</label><input type="date" class="fld" id="dlg-al" value="'+iso(HOY)+'"></div>';
    }
    if(cfg.buscar){
      tools.innerHTML += '<div class="fgroup"><label class="flabel">Buscar</label><input type="text" class="fld" id="dlg-texto" placeholder="'+esc(cfg.buscar)+'"></div>';
    }
    tools.innerHTML += '<div style="display:flex;gap:8px"><button class="btn btn-primary" id="dlg-buscar">Buscar</button><button class="btn btn-ghost" id="dlg-aceptar">Aceptar</button></div>';
    body.appendChild(tools);
  }

  const host = document.createElement('div');
  host.id = 'dlg-host';
  body.appendChild(host);
  if(cfg.subtitle){ const s=document.createElement('p'); s.className='sub'; s.textContent=cfg.subtitle; body.insertBefore(s, body.firstChild); }

  const foot = document.createElement('div');
  foot.className = 'dlg-foot';
  foot.innerHTML = '<button class="btn" id="dlg-imprimir">Imprimir</button>'+
    '<button class="btn" id="dlg-color">Cambiar color</button>'+
    '<button class="btn btn-ghost" id="dlg-cancelar">Cancelar</button>'+
    '<button class="btn btn-primary" id="dlg-salir">Salir</button>';

  dlg.appendChild(head); dlg.appendChild(body); dlg.appendChild(foot);
  overlay.appendChild(dlg);
  dlgState = { cfg:cfg, host:host, dlg:dlg };

  function render(){
    const al = cfg.al ? ($('dlg-al').value || iso(HOY)) : iso(HOY);
    const texto = cfg.buscar ? ($('dlg-texto').value.trim().toLowerCase()) : '';
    const r = cfg.rows({ al:al, texto:texto });
    host.innerHTML = tableHTML(r.cols, r.rows, r.total);
    status(cfg.title + ' · ' + r.rows.length + ' registro(s) · Al ' + fecha(al));
  }
  dlgState.render = render;

  if($('dlg-buscar')) $('dlg-buscar').addEventListener('click', render);
  if($('dlg-aceptar')) $('dlg-aceptar').addEventListener('click', render);
  if($('dlg-texto')) $('dlg-texto').addEventListener('input', render);
  if($('dlg-al')) $('dlg-al').addEventListener('change', render);

  $('dlg-imprimir').addEventListener('click', ()=>{ status('Enviando a impresora: '+cfg.title); window.print(); });
  $('dlg-color').addEventListener('click', function(){ openPalette(this, '#f5a623', c=> dlg.style.setProperty('--dlg-accent', c)); });
  $('dlg-cancelar').addEventListener('click', ()=> cerrarDialogo());
  $('dlg-salir').addEventListener('click', ()=> cerrarDialogo());

  render();
}
function cerrarDialogo(){ $('overlay').classList.add('hidden'); $('overlay').innerHTML=''; dlgState=null; closePalette(); status('Listo'); }

function tableHTML(cols, rows, total){
  if(!rows.length) return '<p class="empty">No hay información para los criterios indicados.</p>';
  let h = '<div class="tbl-wrap"><table class="tbl"><thead><tr>';
  cols.forEach(c=> h += '<th'+(c.num?' class="num"':'')+'>'+esc(c.t)+'</th>');
  h += '</tr></thead><tbody>';
  rows.forEach(r=>{ h += '<tr>'; r.forEach(c=> h += '<td'+(c.num?' class="num"':'')+'>'+c.v+'</td>'); h += '</tr>'; });
  h += '</tbody>';
  if(total){ h += '<tfoot><tr>'; total.forEach(c=> h += '<td'+(c.num?' class="num"':'')+'>'+c.v+'</td>'); h += '</tr></tfoot>'; }
  h += '</table></div>';
  return h;
}

    const rows=rr.map(x=>{ ts+=x.saldo; return [
      {v:x.numero},{v:esc(x.cliente)},{v:fecha(x.vencimiento)},{v:money(x.monto),num:true},{v:money(x.abonado),num:true},{v:money(x.saldo),num:true}]; });
    return {cols:[{t:'Factura'},{t:'Cliente'},{t:'Vence'},{t:'Monto',num:true},{t:'Abonado',num:true},{t:'Saldo',num:true}],rows:rows,
      total:rows.length?[{v:'Total vencido ('+rows.length+')'},{v:''},{v:''},{v:''},{v:''},{v:money(ts),num:true}]:null};
  }},
  recibos:{ title:'Recibos Emitidos', al:true, buscar:'Cliente / recibo', rows:function(f){
    const rr=COBROS.filter(c=>c.fecha<=f.al && matchText(c.numero+' '+c.cliente+' '+c.cobrador,f.texto)); let tm=0;
    const rows=rr.map(c=>{ tm+=c.monto; return [{v:c.numero},{v:fecha(c.fecha)},{v:esc(c.cliente)},{v:money(c.monto),num:true},{v:esc(c.forma)},{v:esc(c.cobrador)}]; });
    return {cols:[{t:'Recibo'},{t:'Fecha'},{t:'Cliente'},{t:'Monto',num:true},{t:'Forma'},{t:'Cobrador'}],rows:rows,
      total:rows.length?[{v:'Total'},{v:''},{v:''},{v:money(tm),num:true},{v:''},{v:''}]:null};
  }},
  cobroscliente:{ title:'Cobros por Cliente', al:true, buscar:'Cliente', rows:function(f){
    const g={}; COBROS.filter(c=>c.fecha<=f.al).forEach(c=>{ if(!matchText(c.cliente,f.texto)) return; if(!g[c.cliente]) g[c.cliente]={n:0,m:0}; g[c.cliente].n++; g[c.cliente].m+=c.monto; });
    let tn=0,tm=0;
    const rows=Object.keys(g).sort().map(k=>{ tn+=g[k].n; tm+=g[k].m; return [{v:esc(k)},{v:String(g[k].n),num:true},{v:money(g[k].m),num:true}]; });
    return {cols:[{t:'Cliente'},{t:'Recibos',num:true},{t:'Monto',num:true}],rows:rows,
      total:rows.length?[{v:'Total'},{v:String(tn),num:true},{v:money(tm),num:true}]:null};
  }},
  notascredito:{ title:'Notas de Crédito', al:true, buscar:'Cliente / documento', rows:function(f){
    const rr=NOTAS.filter(n=>n.fecha<=f.al && matchText(n.cliente+' '+n.documento+' '+n.motivo,f.texto)); let tm=0;
    const rows=rr.map(n=>{ tm+=n.monto; return [{v:fecha(n.fecha)},{v:esc(n.cliente)},{v:n.documento},{v:esc(n.motivo)},{v:money(n.monto),num:true}]; });
    return {cols:[{t:'Fecha'},{t:'Cliente'},{t:'Documento'},{t:'Motivo'},{t:'Monto',num:true}],rows:rows,
      total:rows.length?[{v:'Total'},{v:''},{v:''},{v:''},{v:money(tm),num:true}]:null};
  }},
  aging:{ title:'Antigüedad de Saldos', buscar:'Cliente', rows:function(f){
    const rr=CLIENTES.filter(c=>c.saldo>0.5 && matchText(c.codigo+' '+c.nombre+' '+c.cobrador,f.texto));
    const tot=[0,0,0,0,0]; let tg=0;
    const rows=rr.map(c=>{ const a=[0,0,0,0,0]; FACTURAS.filter(x=>x.cliente===c.nombre).forEach(x=>{ const b=agingBucket(x); if(b>=0) a[b]+=x.saldo; });
      let t=0; a.forEach((v,i)=>{ tot[i]+=v; t+=v; }); tg+=t;
      return [{v:esc(c.nombre)},{v:money(a[0]),num:true},{v:money(a[1]),num:true},{v:money(a[2]),num:true},{v:money(a[3]),num:true},{v:money(a[4]),num:true},{v:money(t),num:true}]; });
    return {cols:[{t:'Cliente'},{t:'Corriente',num:true},{t:'1-30',num:true},{t:'31-60',num:true},{t:'61-90',num:true},{t:'+90',num:true},{t:'Total',num:true}],rows:rows,
      total:rows.length?[{v:'Totales'},{v:money(tot[0]),num:true},{v:money(tot[1]),num:true},{v:money(tot[2]),num:true},{v:money(tot[3]),num:true},{v:money(tot[4]),num:true},{v:money(tg),num:true}]:null};
  }},
  saldocliente:{ title:'Saldos por Cliente', buscar:'Cliente / cobrador', rows:function(f){
    const rr=CLIENTES.filter(c=>matchText(c.codigo+' '+c.nombre+' '+c.cobrador,f.texto)); let ts=0,tv=0;
    const rows=rr.map(c=>{ ts+=c.saldo; tv+=c.vencido; return [{v:esc(c.nombre)},{v:esc(c.cobrador)},{v:money(c.saldo),num:true},{v:money(c.vencido),num:true},{v:money(Math.max(0,c.saldo-c.vencido)),num:true}]; });
    return {cols:[{t:'Cliente'},{t:'Cobrador'},{t:'Saldo',num:true},{t:'Vencido',num:true},{t:'Al Día',num:true}],rows:rows,
      total:rows.length?[{v:'Total'},{v:''},{v:money(ts),num:true},{v:money(tv),num:true},{v:money(Math.max(0,ts-tv)),num:true}]:null};
  }},
  vencidoaldia:{ title:'Vencido vs Al Día', buscar:'Cliente / cobrador', rows:function(f){
    const rr=CLIENTES.filter(c=>c.saldo>0.5 && matchText(c.nombre+' '+c.cobrador,f.texto)); let tv=0,td=0;
    const rows=rr.map(c=>{ const dia=Math.max(0,c.saldo-c.vencido); tv+=c.vencido; td+=dia; const p=c.saldo?c.vencido/c.saldo*100:0;
      return [{v:esc(c.nombre)},{v:money(c.vencido),num:true},{v:money(dia),num:true},{v:money(c.saldo),num:true},{v:p.toFixed(1)+' %',num:true}]; });
    return {cols:[{t:'Cliente'},{t:'Vencido',num:true},{t:'Al Día',num:true},{t:'Total',num:true},{t:'% Vencido',num:true}],rows:rows,
      total:rows.length?[{v:'Total'},{v:money(tv),num:true},{v:money(td),num:true},{v:money(tv+td),num:true},{v:((tv+td)?tv/(tv+td)*100:0).toFixed(1)+' %',num:true}]:null};
  }},
  cobrador:{ title:'Resumen por Cobrador', buscar:'Cobrador', rows:function(f){
    const cob=[]; CLIENTES.forEach(c=>{ if(!cob.find(x=>x.nombre===c.cobrador)) cob.push({nombre:c.cobrador}); });
    let tcl=0,tcar=0,tven=0,tcob=0;
    const rows=cob.filter(c=>matchText(c.nombre,f.texto)).map(c=>{
      const cl=CLIENTES.filter(x=>x.cobrador===c.nombre);
      const cartera=cl.reduce((a,x)=>a+x.saldo,0), vencido=cl.reduce((a,x)=>a+x.vencido,0);
      const cobrado=COBROS.filter(x=>x.cobrador===c.nombre).reduce((a,x)=>a+x.monto,0);
      tcl+=cl.length; tcar+=cartera; tven+=vencido; tcob+=cobrado;
      return [{v:esc(c.nombre)},{v:String(cl.length),num:true},{v:money(cartera),num:true},{v:money(vencido),num:true},{v:money(cobrado),num:true}];
    });
    return {cols:[{t:'Cobrador'},{t:'Clientes',num:true},{t:'Cartera',num:true},{t:'Vencido',num:true},{t:'Cobrado',num:true}],rows:rows,
      total:rows.length?[{v:'Total'},{v:String(tcl),num:true},{v:money(tcar),num:true},{v:money(tven),num:true},{v:money(tcob),num:true}]:null};
  }}
};

/* ---------- Gráficos ---------- */
const CHART_DEFS = [
  {id:'cobros',      title:'Cobros por Mes',           kind:'month', series:[{sid:'cobros',name:'Cobros',color:'#f5a623'}]},
  {id:'vencido',     title:'Saldo Vencido vs Al Día',  kind:'month', series:[{sid:'vencido',name:'Vencido',color:'#f2545b'},{sid:'aldia',name:'Al Día',color:'#34d399'}]},
  {id:'agingch',     title:'Antigüedad de Saldos',     kind:'cat',   series:[{sid:'aging',name:'Saldo',color:'#3b82f6'}]}
];
const chartColors = { series:{}, grid:'#1b2836', axis:'#33475f', text:'#7f93ac' };
const colorOf = s => chartColors.series[s.sid] || s.color;
function mcount(){ const v=$('ch-al')?$('ch-al').value:iso(HOY); const d=v?new Date(v+'T00:00:00'):HOY; return Math.max(1,Math.min(12,d.getMonth()+1)); }
function chartType(){ const r=document.querySelector('input[name="ch-tipo"]:checked'); return r?r.value:'line'; }
function chartData(def){
  if(def.kind==='cat') return { labels:AGING_BUCKETS, series:def.series.map(s=>({name:s.name,color:colorOf(s),data:agingTotals()})) };
  const n=mcount();
  return { labels:MES.slice(0,n), series:def.series.map(s=>({name:s.name,color:colorOf(s),data:SERIES[s.sid].slice(0,n)})) };
}
function chartSVG(labels, series, type){
  const W=560,H=280,pad={l:66,r:16,t:24,b:40}, pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  let max=0; series.forEach(s=> s.data.forEach(v=> max=Math.max(max,v)));
  const mx=(max||1)*1.15, n=labels.length, slot=pw/n;
  const X=i=> pad.l + slot*(i+0.5);
  const Y=v=> pad.t+ph-(v/mx)*ph;
  let g='';
  for(let k=0;k<=4;k++){ const gy=pad.t+ph-(k/4)*ph;
    g+='<line x1="'+pad.l+'" y1="'+gy+'" x2="'+(W-pad.r)+'" y2="'+gy+'" stroke="'+chartColors.grid+'"/>';
    g+='<text x="'+(pad.l-8)+'" y="'+(gy+4)+'" text-anchor="end" font-size="10" fill="'+chartColors.text+'">'+compact(mx*k/4)+'</text>'; }
  g+='<line x1="'+pad.l+'" y1="'+pad.t+'" x2="'+pad.l+'" y2="'+(pad.t+ph)+'" stroke="'+chartColors.axis+'"/>';
  g+='<line x1="'+pad.l+'" y1="'+(pad.t+ph)+'" x2="'+(W-pad.r)+'" y2="'+(pad.t+ph)+'" stroke="'+chartColors.axis+'"/>';
  if(type==='bar'){
    const gw=slot*0.66, bw=gw/series.length;
    series.forEach((s,si)=> s.data.forEach((v,i)=>{ const bx=pad.l+slot*i+(slot-gw)/2+si*bw, by=Y(v);
      if(pad.t+ph-by>0) g+='<rect x="'+bx+'" y="'+by+'" width="'+Math.max(2,bw-2)+'" height="'+(pad.t+ph-by)+'" rx="2" fill="'+s.color+'"><title>'+labels[i]+' · '+s.name+': '+money(v)+'</title></rect>'; }));
  } else {
    series.forEach(s=>{ const pts=s.data.map((v,i)=>X(i)+','+Y(v)).join(' ');
      if(series.length===1) g+='<polygon points="'+pad.l+','+(pad.t+ph)+' '+pts+' '+(pad.l+pw)+','+(pad.t+ph)+'" fill="'+s.color+'" opacity="0.12"/>';
      g+='<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round"/>';
      s.data.forEach((v,i)=>{ g+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.4" fill="#0d151f" stroke="'+s.color+'" stroke-width="2.2"><title>'+labels[i]+' · '+s.name+': '+money(v)+'</title></circle>'; }); });
  }
  labels.forEach((l,i)=>{ g+='<text x="'+X(i)+'" y="'+(pad.t+ph+18)+'" text-anchor="middle" font-size="10.5" fill="'+chartColors.text+'">'+l+'</text>'; });
  let lx=pad.l-6; series.forEach(s=>{ g+='<rect x="'+lx+'" y="4" width="10" height="10" rx="2" fill="'+s.color+'"/><text x="'+(lx+14)+'" y="13" font-size="10" fill="'+esc(''+chartColors.text)+'">'+esc(s.name)+'</text>'; lx += 20 + s.name.length*6.4; });
  return g;
}
function card(def){
  return '<div class="card"><h3><span>'+def.title+'</span><span class="val" id="sum-'+def.id+'"></span></h3>'+
    '<svg id="ch-'+def.id+'" viewBox="0 0 560 280" preserveAspectRatio="xMidYMid meet"></svg></div>';
}
function chartsUI(){
  return '<div class="charts-head">'+
    '<div class="fgroup"><label class="flabel">Al (fecha final)</label><input type="date" class="fld" id="ch-al" value="'+iso(HOY)+'"></div>'+
    '<div class="fgroup"><label class="flabel">Presentación</label><div class="radios">'+
      '<label class="radio"><input type="radio" name="ch-tipo" value="line" checked> Lineal</label>'+
      '<label class="radio"><input type="radio" name="ch-tipo" value="bar"> Barras</label></div></div>'+
    '<div style="display:flex;gap:8px"><button class="btn" id="ch-color">Cambiar color</button></div>'+
    '<span class="val" style="margin-left:auto;color:var(--muted)">Tasa oficial: US$ 1 = C$ 19.960</span></div>'+
    '<div class="charts-grid">'+ CHART_DEFS.map(card).join('') +'</div>';
}
function drawAllCharts(){
  if(!$('ch-cobros')) return;
  const type=chartType();
  CHART_DEFS.forEach(function(def){
    const d=chartData(def), el=$('ch-'+def.id);
    if(el) el.innerHTML=chartSVG(d.labels,d.series,type);
    const sum=$('sum-'+def.id);
    if(sum){ const t=d.series.reduce((a,s)=>a+s.data.reduce((x,y)=>x+y,0),0); sum.textContent=money(t)+' / '+usd(t); }
  });
  status('Gráficos · '+(type==='bar'?'Barras':'Lineal')+' · '+mcount()+' mes(es)');
}
function chartsPalette(anchor){
  closePalette();
  const p=document.createElement('div'); p.className='palette';
  const items=[]; CHART_DEFS.forEach(def=> def.series.forEach(s=>{ if(!items.find(x=>x.sid===s.sid)) items.push(s); }));
  p.innerHTML='<div class="pt">Colores de las gráficas</div>'+
    items.map(s=>'<label>'+esc(s.name)+' <input type="color" data-sid="'+s.sid+'" value="'+colorOf(s)+'"></label>').join('')+
    '<label>Rejilla <input type="color" data-sid="__grid" value="'+chartColors.grid+'"></label>'+
    '<label>Ejes <input type="color" data-sid="__axis" value="'+chartColors.axis+'"></label>'+
    '<div class="swatches">'+['#f5a623','#3b82f6','#34d399','#f2545b','#a78bfa','#22d3ee'].map(c=>'<span class="sw" style="background:'+c+'" data-c="'+c+'"></span>').join('')+'</div>';
  document.body.appendChild(p);
  const r=anchor.getBoundingClientRect();
  p.style.left=Math.min(r.left,window.innerWidth-266)+'px';
  p.style.top=Math.min(r.bottom+6,window.innerHeight-330)+'px';
  paletteEl=p;
  p.querySelectorAll('input[type=color]').forEach(inp=> inp.addEventListener('input',()=>{
    const k=inp.dataset.sid;
    if(k==='__grid') chartColors.grid=inp.value;
    else if(k==='__axis') chartColors.axis=inp.value;
    else chartColors.series[k]=inp.value;
    drawAllCharts();
  }));
  p.querySelectorAll('.sw').forEach(sw=> sw.addEventListener('click',()=>{
    const c=sw.dataset.c;
    items.forEach(s=>{ chartColors.series[s.sid]=c; });
    p.querySelectorAll('input[data-sid]:not([data-sid="__grid"]):not([data-sid="__axis"])').forEach(i=> i.value=c);
    drawAllCharts();
  }));
  setTimeout(()=> document.addEventListener('mousedown', outside),0);
  function outside(e){ if(paletteEl && !paletteEl.contains(e.target) && e.target!==anchor){ closePalette(); document.removeEventListener('mousedown', outside); } }
}
function bindCharts(){
  if($('ch-al')) $('ch-al').addEventListener('change', drawAllCharts);
  document.querySelectorAll('input[name="ch-tipo"]').forEach(r=> r.addEventListener('change', drawAllCharts));
  if($('ch-color')) $('ch-color').addEventListener('click', function(){ chartsPalette(this); });
}

/* ---------- Inicio ---------- */
function init(){
  renderShell();
  bindCharts();
  tick(); setInterval(tick,1000);
  $('overlay').addEventListener('mousedown', function(e){ if(e.target===$('overlay')) cerrarDialogo(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(paletteEl) closePalette(); else if(dlgState) cerrarDialogo(); } });
  drawAllCharts();
  status('Listo');
}
document.addEventListener('DOMContentLoaded', init);
</script>
